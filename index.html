<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Socrarius Item Box</title>
    <style>
        body {
            background: rgba(0, 5, 15, 0.9);
            color: #e0f7ff;
            font-family: 'Consolas', monospace;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* 🌸 上部固定バナー */
        .system-banner {
            position: fixed;
            top: 0; left: 0; width: 100%;
            height: 40px;
            background: rgba(0, 105, 217, 0.3);
            border-bottom: 1px solid #00f2fe;
            display: flex;
            align-items: center;
            padding-left: 20px;
            font-size: 14px;
            letter-spacing: 2px;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        /* 🌸 セクション区切り（完全黒バー） */
        .section-title {
            background: #000; /* 完全な黒 */
            color: #00f2fe;
            padding: 10px 20px;
            margin: 40px 0 20px 0; /* 上にバナー分の余白 */
            font-size: 12px;
            font-weight: bold;
            border-left: 5px solid #00f2fe;
            letter-spacing: 3px;
            box-shadow: inset 0 0 10px rgba(0, 242, 254, 0.2);
        }

        /* ショップセクション用の余白調整 */
        .shop-title {
            margin-top: 20px; 
        }

        /* 🌸 写真格納庫（グリッド） */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }

        .memory-card {
            border: 1px solid rgba(0, 242, 254, 0.3);
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            transition: 0.3s;
            text-decoration: none; /* リンクの線を消す */
            display: block;
        }

        .memory-card:hover {
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            transform: scale(1.02);
        }

        .memory-card img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 2px;
        }

        .memory-card .label {
            margin-top: 8px;
            font-size: 11px;
            color: #00f2fe;
            text-align: center;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* カスタムスクロールバー */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #345485; }
    </style>
</head>
<body>

    <div class="system-banner">
        "Link & Calendar"
    </div>

      <!-- 📅 カレンダーエリア -->
  <iframe src="https://calendar.google.com/calendar/embed?src=kennew0922%40gmail.com&ctz=Asia%2FTokyo" 
          style="border:0; width:100%; height:500px;" frameborder="0"></iframe>

    <!-- 🌸 ITEM LIST セクション -->
    <div class="section-title">ITEM LIST</div>
    <div class="gallery">
        <div class="memory-card">
            <img src="https://kennew0922-lgtm.github.io/Socrariu-items/photo1.jpg" alt="Memory 1">
            <div class="label">Fantasy Projector</div>
        </div>
        <div class="memory-card">
            <img src="https://kennew0922-lgtm.github.io/Socrariu-items/photo2.jpg" alt="Memory 1">
            <div class="label">Ninten Switcher</div>
        </div>
        <div class="memory-card">
            <img src="https://kennew0922-lgtm.github.io/Socrariu-items/photo3.jpg" alt="Memory 1">
            <div class="label">Gibsun guitar</div>
        </div>
    </div>

    <!-- 🌸 SHOPPING SITE セクション -->
    <div class="section-title shop-title">SHOPSITE</div>
    <div class="gallery">
        <!-- Amazonリンク（カード全体をリンクにしています） -->
        <a href="https://www.amazon.co.jp/" target="_blank" rel="noopener" class="memory-card">
            <img src="https://kennew0922-lgtm.github.io/Socrariu-items/photo4.jpg" alt="Amazon">
            <div class="label">Amazon</div>
        </a>
        
     <div class="gallery">
        <a href="https://jp.mercari.com/" target="_blank" rel="noopener" class="memory-card">
            <img src="https://kennew0922-lgtm.github.io/Socrariu-items/photo5.jpg" alt="Memory 1">
            <div class="label">Mercari</div>
        </a>
        </div>
    </div> 

</body>
</html>
