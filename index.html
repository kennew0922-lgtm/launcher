<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Socrarius Item Box</title>
    <style>
        body {
            background: rgba(0, 5, 15, 0.9);
            color: #e0f7ff;
            font-family: 'Consolas', monospace;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* 🌸 上部固定バナー */
        .system-banner {
            position: fixed;
            top: 0; left: 0; width: 100%;
            height: 40px;
            background: rgba(0, 105, 217, 0.3);
            border-bottom: 1px solid #00f2fe;
            display: flex;
            align-items: center;
            padding-left: 20px;
            font-size: 14px;
            letter-spacing: 2px;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        /* 🌸 左右レイアウトコンテナ */
        .main-layout {
            display: flex;
            gap: 20px;
            margin-top: 60px;
        }

        .left-content {
            flex: 4;
            overflow-y: auto;
            height: calc(100vh - 80px);
        }

        .right-content {
            flex: 6;
            position: sticky;
            top: 60px;
        }

        /* 🌸 セクション区切り */
        .section-title {
            background: #000;
            color: #00f2fe;
            padding: 10px 20px;
            margin: 20px 0 15px 0;
            font-size: 12px;
            font-weight: bold;
            border-left: 5px solid #00f2fe;
            letter-spacing: 3px;
            box-shadow: inset 0 0 10px rgba(0, 242, 254, 0.2);
        }

        /* 🌸 アイテム枠（グリッド） */
        .gallery {
            display: grid;
            /* 🌸 アイコンのサイズに合わせて幅を小さく調整 */
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            border: 1px solid rgba(0, 242, 254, 0.15);
            padding: 15px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 4px;
        }

        /* 🌸 アイコン画像（リンク）の魔法 */
        .icon-link {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.3s;
        }

        /* 🌸 ホバーで画像だけが「ふわっと」浮き上がる */
        .icon-link:hover img {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4);
            border-color: #00f2fe;
        }

        .icon-link img {
            width: 55px;
            height: 55px;
            object-fit: cover;
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 4px;
            transition: 0.3s;
        }

        .icon-link .label {
            margin-top: 8px;
            font-size: 10px;
            color: #00f2fe;
            text-align: center;
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* 🌸 カレンダーダークフィルター */
        .right-content iframe {
            filter: invert(90%) hue-rotate(180deg) brightness(1.1) contrast(0.9);
            border-radius: 8px;
            background-color: #000;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #345485; }
    </style>
</head>
<body>

    <div class="system-banner">Link & Calendar</div>

    <div class="main-layout">
        <div class="left-content">
            <div style="font-size: 12px; margin-bottom: 20px; line-height: 1.8;">
                [INDEX]<br>
                - <a href="#section1" style="color:#00f2fe;">BUSINESS WEBSITE</a><br>
                - <a href="#section2" style="color:#00f2fe;">WORK WEBSITE (MATERIAL)</a><br>
                - <a href="#section3" style="color:#00f2fe;">WORK WEBSITE (CONVERTER)</a>
            </div>

            <!-- BUSINESS セクション -->
            <div class="section-title" id="section1">BUSINESS WEBSITE</div>
            <div class="gallery">
                <a href="https://www.dlsite.com/circle/circle/webup" target="_blank" class="icon-link">
                    <img src="https://kennew0922-lgtm.github.io/Socrariu-items/photo1.jpg">
                </a>
                <a href="https://www.dlsite.com/circle/circle/webup" target="_blank" class="icon-link">
                    <img src="https://kennew0922-lgtm.github.io/Socrariu-items/photo2.jpg">
                </a>
                <a href="https://www.dlsite.com/circle/circle/webup" target="_blank" class="icon-link">
                    <img src="https://kennew0922-lgtm.github.io/Socrariu-items/photo3.jpg">
                </a>
            </div>

            <!-- WORK セクション (MATERIAL) -->
            <div class="section-title" id="section2">WORK WEBSITE (MATERIAL)</div>
            <div class="gallery">
                <a href="https://www.amazon.co.jp/" target="_blank" class="icon-link">
                    <img src="https://kennew0922-lgtm.github.io/Socrariu-items/photo4.jpg">
                </a>
                <a href="https://jp.mercari.com/" target="_blank" class="icon-link">
                    <img src="https://kennew0922-lgtm.github.io/Socrariu-items/photo5.jpg">
                </a>
            </div>

            <!-- WORK セクション (CONVERTER) -->
            <div class="section-title" id="section3">WORK WEBSITE (CONVERTER)</div>
            <div class="gallery">
                <a href="#" class="icon-link">
                    <img src="https://kennew0922-lgtm.github.io/Socrariu-items/photo4.jpg">
                </a>
                <a href="#" class="icon-link">
                    <img src="https://kennew0922-lgtm.github.io/Socrariu-items/photo4.jpg">
                </a>
            </div>
        </div>

            <div class="right-content">
            <iframe src="https://calendar.google.com/calendar/embed?src=kennew0922%40gmail.com&ctz=Asia%2FTokyo" 
            style="border:1px solid rgba(0,242,254,0.3); width:100%; height:400px;" frameborder="0" scrolling="no"></iframe>
            </div>
    </div>
</body>
</html>
