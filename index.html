<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Socrarius Item Box</title>
    <style>
        body {
            background: rgba(0, 5, 15, 0.9);
            color: #e0f7ff;
            font-family: 'Consolas', monospace;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* 🌸 上部固定バナー */
        .system-banner {
            position: fixed;
            top: 0; left: 0; width: 100%;
            height: 40px;
            background: rgba(0, 105, 217, 0.3);
            border-bottom: 1px solid #00f2fe;
            display: flex;
            align-items: center;
            padding-left: 20px;
            font-size: 14px;
            letter-spacing: 2px;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        /* 🌸 セクション区切り（完全黒バー） */
        .section-title {
            background: #000; /* 完全な黒 */
            color: #00f2fe;
            padding: 10px 20px;
            margin: 40px 0 20px 0; /* 上にバナー分の余白 */
            font-size: 12px;
            font-weight: bold;
            border-left: 5px solid #00f2fe;
            letter-spacing: 3px;
            box-shadow: inset 0 0 10px rgba(0, 242, 254, 0.2);
        }


        /* ショップセクション用の余白調整 */
        .shop-title {
            margin-top: 20px; 
        }

        /* 🌸 写真格納庫（グリッド） */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }

        .memory-card {
            border: 1px solid rgba(0, 242, 254, 0.3);
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            transition: 0.3s;
            text-decoration: none; /* リンクの線を消す */
            display: block;
        }

        .memory-card:hover {
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            transform: scale(1.02);
        }

        .memory-card img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 2px;
        }

        .memory-card .label {
            margin-top: 8px;
            font-size: 11px;
            color: #00f2fe;
            text-align: center;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* 🌸 カレンダーをダークにする魔法のフィルター */
.right-content iframe {
    filter: invert(90%) hue-rotate(180deg) brightness(1.1) contrast(0.9);
    border-radius: 8px;
    /* 🌸 背景の白がチラ見えしないように裏側を黒くしておく */
    background-color: #000;
}

        /* 🌸 左右分割のためのメインコンテナ */
.main-layout {
    display: flex;
    gap: 20px;
    margin-top: 60px; /* バナーの高さ分 */
}

/* 🌸 左側（リンク集）の設定：幅40% */
.left-content {
    flex: 4;
    overflow-y: auto;
    height: calc(100vh - 80px); /* 画面の高さに合わせる */
}

/* 🌸 右側（カレンダー）の設定：幅60%（固定気味） */
.right-content {
    flex: 6;
    position: sticky;
    top: 60px;
}

        /* カスタムスクロールバー */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #345485; }
    </style>
</head>
<body>

    <div class="system-banner">
        "Link & Calendar"
    </div>

    <!-- 🌸 ここから左右分割の魔法 -->
    <div class="main-layout">

        <!-- 🌸 左側：リンク集エリア -->
        <div class="left-content">
            <div style="margin-bottom: 20px;">
                [INDEX]<br>
                - <a href="#section1" style="color:#00f2fe;">BUSINESS WEBSITE</a><br>
                - <a href="#section2" style="color:#00f2fe;">WORK WEBSITE</a>
            </div>

            <!-- BUSINESS セクション -->
            <div class="section-title" id="section1">BUSINESS WEBSITE</div>
            <div class="gallery">
                <!-- ここに既存の memory-card たちを入れる -->
                <div class="memory-card">
                    <img src="https://kennew0922-lgtm.github.io/Socrariu-items/photo1.jpg">
                    <div class="label">Fantasy Projector</div>
                </div>
                <!-- ...続く -->
            </div>

            <!-- WORK セクション -->
            <div class="section-title shop-title" id="section2">WORK WEBSITE</div>
            <div class="gallery">
                <!-- ここに既存の Amazon や Mercari を入れる -->
                <a href="https://www.amazon.co.jp/" target="_blank" class="memory-card">
                    <img src="https://kennew0922-lgtm.github.io/Socrariu-items/photo4.jpg">
                    <div class="label">Amazon</div>
                </a>
                <!-- ...続く -->
            </div>
        </div>

        <!-- 🌸 右側：カレンダーエリア -->
        <div class="right-content">
            <iframe src="https://calendar.google.com/calendar/embed?src=kennew0922%40gmail.com&ctz=Asia%2FTokyo" 
                    style="border:1px solid rgba(0,242,254,0.3); width:100%; height:500px;" frameborder="0" scrolling="no"></iframe>
        </div>

    </div> <!-- main-layout 終わり -->

</body>
</html>
